openapi: 3.1.0
info:
  title: Asset Repair Management API
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: Auth
    description: Authentication and token management
  - name: Assets
    description: Asset CRUD and listing
  - name: Maintenance
    description: Maintenance requests workflows
  - name: Stats
    description: Dashboard statistics
  - name: Meta
    description: Lightweight meta data for forms
  - name: Search
    description: Quick search endpoints
  - name: Chat
    description: Threaded chat endpoints
  - name: Health
    description: Healthcheck
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive bearer token
      description: |
        The token expires 30 days after it is issued (then sign in again). Wrong tries are counted per citizen_id + IP
        (5, then 60 s) and per IP over all accounts (30 in 5 minutes); a locked caller gets 429 with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                citizen_id: { type: string, pattern: '^[0-9]{13}$', description: 13-digit citizen id }
                password: { type: string }
                device_name: { type: string, maxLength: 120 }
              required: [citizen_id, password]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  token_type: { type: string, description: Always Bearer }
                  user:
                    $ref: '#/components/schemas/LoginUser'
        '401':
          description: "invalid_credentials (a wrong password and an unknown citizen id read the same)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: "account_suspended (only shown when the password was right)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "citizen_id or password is missing or not well formed (`errors` names the field)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '429':
          description: "too_many_attempts (see Retry-After) or RATE_LIMITED"
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds to wait }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current authenticated user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/tokens:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: List active personal access tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        abilities:
                          type: array
                          items: { type: string }
                        last_used_at: { type: string, nullable: true }
                        created_at: { type: string }
  /auth/tokens/{id}:
    delete:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Revoke a token by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '404':
          description: "Not a token of this account"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/password:
    put:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Change my own password
      description: >
        Also the way out for an account whose password an admin chose: every other call answers 403 `password_change_required` until this
        succeeds. The token used for this call stays valid; every other token of the account ends. 6 calls a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, description: "8+ characters with a letter and a digit, different from the current one" }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  must_change_password: { type: boolean }
        '422':
          description: "The current password is wrong, or the new one is weak, unconfirmed or the same"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Logout (revoke current token)
      description: With a bearer token that token is revoked; called with the browser's own session the session ends.
      responses:
        '200':
          description: "Logged out"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /auth/logout-all:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Logout and revoke all tokens
      responses:
        '200':
          description: "Logged out everywhere"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
  /auth/password/email:
    post:
      tags: [Auth]
      summary: Request password reset email
      description: |
        Answers 200 with the same message whether or not the address has an account (a different answer would list the
        addresses that do); the mail, if any, is sent after the response. 5 requests per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        '200':
          description: "Accepted: 'if this address has an account, a link is on its way'"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '422':
          description: "Not a well-formed address"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password with token
      description: |
        Success ends every other way into the account: all API tokens, "remember me" cookies and browser sessions.
        A wrong token, an expired one and an unknown address are refused in the same words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, minLength: 8, description: At least 8 characters with a letter and a digit }
                password_confirmation: { type: string }
              required: [email,token,password,password_confirmation]
      responses:
        '200':
          description: "Reset OK"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '400':
          description: "password_reset_failed"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "The password does not meet the rule, or is not confirmed"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /assets:
    get:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: List assets (paginated)
      description: Every signed-in person may list assets. Deleted assets are left out.
      parameters:
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - in: query
          name: q
          schema: { type: string }
          description: Matches the code, name, serial number and the like; the best matches come first
        - in: query
          name: status
          schema: { type: string, enum: [active, in_repair, disposed] }
        - in: query
          name: type
          schema: { type: string }
        - in: query
          name: category_id
          schema: { type: integer }
        - in: query
          name: department_id
          schema: { type: integer }
        - in: query
          name: location
          schema: { type: string }
        - in: query
          name: sort_by
          schema: { type: string, enum: [id, asset_code, name, purchase_date, warranty_expire, status, created_at], default: id }
        - in: query
          name: sort_dir
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetList' }
    post:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Create asset
      description: "Admin, supervisor and the repair team. Send JSON, or multipart/form-data to attach `hero_image` and `files`."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetCreate'
      responses:
        '201':
          description: "Created: `{message: created, toast, data}`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResult' }
        '403':
          description: "Not an admin, supervisor or repair-team member"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "Invalid input (`errors` names the fields). A code, serial number or HIS number that belongs to a deleted asset is refused too"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /assets/{id}:
    get:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Show asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetWrapper' }
        '404':
          description: "No such asset (or it was deleted)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Update asset
      description: "`PUT` and `PATCH` are one route: send the fields to change. Admin, supervisor and the repair team."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetUpdate' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AssetUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResult' }
        '403':
          description: "Not an admin, supervisor or repair-team member"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: "No such asset"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "Invalid input, or putting an asset back to `active` while a repair is still open"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    patch:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Update asset (same route and rules as PUT)
      description: "`PUT` and `PATCH` are one route: send the fields to change."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetUpdate' }
          multipart/form-data:
            schema: { $ref: '#/components/schemas/AssetUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetResult' }
        '403':
          description: "Not an admin, supervisor or repair-team member"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: "No such asset"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "Invalid input, or putting an asset back to `active` while a repair is still open"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    delete:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Delete asset
      description: "Not while a repair of it is still open (409)."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: "Deleted: `{message: deleted, toast}`"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '403':
          description: "Not allowed to delete assets"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: "No such asset"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: "The asset still has a repair that is not finished"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /repair-requests:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: List maintenance requests
      description: |
        20 a page. A member sees only the requests they reported; admin, supervisor and the repair team see all of them.
        The order is kept per person on the web; over the API send `sort_by` / `sort_dir` each time.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, acknowledged, accepted, in_progress, on_hold, resolved, closed, cancelled, rejected, returned, completed, returned_expiring] }
          description: "`returned_expiring` = sent back to the reporter and within the last 3 days before the automatic cancel"
        - in: query
          name: q
          schema: { type: string }
          description: Request number, title and the like
        - in: query
          name: asset_id
          schema: { type: integer }
        - in: query
          name: sort_by
          schema: { type: string, enum: [request_no, id, request_date] }
        - in: query
          name: sort_dir
          schema: { type: string, enum: [asc, desc] }
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRequestList' }
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Create maintenance request
      description: "Every signed-in person may report. Send multipart/form-data to attach files (up to 3), or JSON without them. There is no `priority`."
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/MaintenanceRequestCreate' }
          application/json:
            schema: { $ref: '#/components/schemas/MaintenanceRequestCreate' }
      responses:
        '201':
          description: "Created: the new request with its `type`, `asset` and `attachments`, and a toast"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRequestResult' }
        '422':
          description: "Invalid input: `message` is the first error, `errors` names the fields"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /repair-requests/{id}:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Show maintenance request
      description: "Admin and supervisor, the reporter, the people assigned, and the repair team while the request waits to be acknowledged or taken. Everyone else gets 403."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRequestWrapper' }
        '403':
          description: "The caller may not see this request"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: "No such request"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Update maintenance request
      description: |
        Who may edit: admin and supervisor always; the people assigned while the request is accepted, in progress or on hold; the reporter
        while it is pending or acknowledged and nobody is in charge yet. A finished request (resolved, closed, cancelled, rejected) is
        closed to everyone but admin and supervisor. `technician_id`, `user_ids` (the team) and `status` are for staff; a reporter who
        sends `status` gets 422 (they cancel with `POST .../cancel`). A `status` here is a real transition, with the same permission as
        the button and the same rules as `POST .../transition`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestUpdate'
          application/json:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestUpdate'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRequestResult' }
        '403':
          description: "The caller may not edit this request, or not make that status move"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: "No such request"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: "The status move is not one the state map allows; nothing is saved"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "Invalid input (`errors` names the fields)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /repair-requests/{id}/transition:
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Transition maintenance request status
      description: |
        Admin, supervisor, or a person assigned to the request; anyone else gets 403. (The web's acknowledge, accept and reject buttons are
        open to every staff member; this endpoint is not, so staff who are not on the request cannot take it from here.) The move also needs
        the permission of that step's button (only the reporter, or an admin, closes). A move the state map does not allow is 409; the
        reasons that a step needs (`note` for on hold and for sending back) are checked there too.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [pending, acknowledged, accepted, in_progress, on_hold, resolved, closed, cancelled, rejected, returned, completed] }
                note: { type: string, maxLength: 2000, description: "The reason; required for some steps (on hold, sending back)" }
                technician_id: { type: integer, description: Staff only }
              required: [status]
      responses:
        '200':
          description: "Transitioned: the request (with `technician` and `assignments`) and a toast"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRequestResult' }
        '403':
          description: "Not allowed to move this request, or not to that status"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: "No such request"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: "The state map does not allow this move, or a required reason is missing (`message`, `toast`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: "`status` is missing or not a status (`errors`, `toast`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /repair-requests/{id}/logs:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: List maintenance request logs
      description: "Newest first, 20 a page; a Laravel paginator, not wrapped in `data`."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceLogPage' }
        '403':
          description: "The caller may not see this request"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: "No such request"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /user:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: The signed-in user's record
      description: |
        The whole User model minus its hidden fields (no password, remember_token or citizen_id). `/auth/me` is the short profile
        (it includes the caller's own citizen_id) plus the token's abilities.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserRecord' }
  /repair-requests/my-jobs:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: My jobs (requests I lead or am assigned to)
      description: |
        Requests where the caller leads the team or is assigned (not one removed from the job). Staff only: admin, supervisor and the
        repair team; a member gets 403. Declared above `/repair-requests/{id}`, which would otherwise take "my-jobs" for an id.
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Request number or title
        - in: query
          name: status
          schema: { type: string }
          description: A status. Omitted = every status; `all` = every status except closed.
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200':
          description: OK (a Laravel paginator, 20 a page, under `data`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Paginator'
                      - type: object
                        properties:
                          data:
                            type: array
                            items: { $ref: '#/components/schemas/MaintenanceRequest' }
        '403': { description: The caller is a member }
  /repair-requests/pending/evaluations:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: My requests waiting for a rating
      description: |
        Requests I reported that I have approved (status `closed`), have not rated yet, and that are still inside the 30 days
        after the approval. A request that is only `resolved` is not listed: the rating comes after the approval.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MaintenanceRequest' }
  /repair-requests/{id}/cancel:
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Cancel (withdraw) a request
      description: |
        The reporter cancels their own request at any time before it is finished: pending, acknowledged, returned, accepted, in progress
        or on hold. Admin and supervisor may do it for any unfinished request, and staff assigned to the request in the statuses the policy
        allows (`MaintenanceRequestPolicy::cancelByTech`). Any other member, and a request that is already resolved, closed, cancelled or
        rejected, gets 403. This is the only way for a reporter to change a status: `PUT /repair-requests/{id}`
        with a `status` is refused with 422 for them.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancel_reason: { type: string, maxLength: 2000, description: "Kept in the history; \"ยกเลิกโดยผู้ใช้งาน\" when empty" }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '403':
          description: Not allowed (not the reporter or an administrator, or the request is finished)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '422': { description: "cancel_reason is longer than 2,000 characters" }
  /repair-requests/{id}/resubmit:
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Send a request again after fixing it
      description: |
        For a request the staff sent back (`returned`, via `POST …/transition` with `status=returned` and a `note` saying what to fix): the
        reporter, or an admin or supervisor for them, sends it again and it becomes `pending` with the same number and history. A request
        that is not `returned`, or a caller who is not allowed, gets 403. A request left `returned` for 14 days (`REPAIR_RETURN_EXPIRES_AFTER_DAYS`)
        is cancelled by the nightly sweep.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Sent again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '403':
          description: Not the reporter, or the request is not `returned`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
  /repair-requests/{id}/rating:
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Rate a finished request
      description: |
        One score for the whole job, counted for every person on its team. Only the reporter may rate, only after they have approved the
        request (`closed`), once, and within 30 days of the approval. Rating closes nothing: approving is a separate step.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000, description: "Required when the score is 1 or 2" }
              required: [score]
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      maintenance_request_id: { type: integer }
                      rater_id: { type: integer }
                      technician_id: { type: integer, description: The lead the score is tied to }
                      score: { type: integer }
                      comment: { type: string, nullable: true }
        '403': { description: The caller did not report this request }
        '409': { description: The request has been rated already }
        '422': { description: "Not closed yet, past the 30 days, no lead to tie the score to, or invalid input (1-2 stars need a comment)" }
  /attachments:
    post:
      tags: [Maintenance]
      deprecated: true
      security: [{ bearerAuth: [] }]
      summary: Removed (always 410)
      description: |
        Kept so an old client gets a clear answer instead of 404. Attach files when reporting (`POST /repair-requests`, `files[]`);
        add or remove files of an existing request with the web routes `POST|DELETE /maintenance/requests/{req}/attachments`.
        A file is opened with `GET /attachments/{id}` (outside `/api`; the `url` of the attachment, bearer token accepted).
      responses:
        '410': { description: "Gone: {error: deprecated, message}" }
  /attachments/{id}:
    delete:
      tags: [Maintenance]
      deprecated: true
      security: [{ bearerAuth: [] }]
      summary: Removed (410 for an attachment that exists)
      description: See `POST /attachments`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '410': { description: "Gone: {error: deprecated, message}" }
        '404': { description: No attachment has this id }
  /stats/summary:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Dashboard summary statistics
      description: |
        System-wide numbers, the same for everyone, cached for 60 seconds; deleted requests and assets are not counted.
        `requests_open` = pending, acknowledged, accepted, in progress, on hold; `requests_closed` = resolved, closed, cancelled, rejected.
        A request that is `returned` (sent back to the reporter) or has the old status `completed` is in neither count.
      responses:
        '200':
          description: Stats summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets_total: { type: integer }
                  requests_open: { type: integer }
                  requests_closed: { type: integer }
                  recent_daily:
                    description: The last 7 days, oldest first; a day with no request is 0
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }
  /stats/maintenance/status-counts:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Maintenance status counts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: { type: integer }
  /stats/maintenance/technicians:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Technician performance summary
      description: |
        Per person on a request's team, at most 50. Everyone on the team of a request counts (a person in charge with no team row once),
        so the rows add up to more than the number of requests. Managers only (the `maintenance-type-manage` ability): it is individual
        performance, not a total.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TechnicianSummary' }
        '403':
          description: "The caller is not a manager"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /stats/assets/by-department:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Asset counts by department
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DepartmentAssetCount' }
  /meta/departments:
    get:
      tags: [Meta]
      security: [{ bearerAuth: [] }]
      summary: List departments meta
      description: At most 50, by Thai name.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Code, Thai or English name
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        code: { type: string }
                        name: { type: string, description: The Thai name }
                        display: { type: string, description: Thai name with the English one in brackets }
  /meta/categories:
    get:
      tags: [Meta]
      security: [{ bearerAuth: [] }]
      summary: List asset categories meta
      description: At most 50, by name.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Name or slug
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        slug: { type: string }
                        color: { type: string, nullable: true }
                        description: { type: string, nullable: true }
  /meta/users:
    get:
      tags: [Meta]
      security: [{ bearerAuth: [] }]
      summary: List users (filter by role)
      description: |
        At most 200, by name, without suspended accounts. Managers (the `maintenance-type-manage` ability) see every role; everyone else
        is offered only the repair team, never other members.
      parameters:
        - in: query
          name: role
          schema: { type: string, enum: [admin, supervisor, it_support, network, programmer, technician, member] }
          description: Omitted = every role the caller may see
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        role: { type: string }
                        department: { type: string, nullable: true }
  /search/assets:
    get:
      tags: [Search]
      security: [{ bearerAuth: [] }]
      summary: Quick asset search
      description: For autocomplete. Deleted assets are left out.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Code or name
        - in: query
          name: department_id
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        code: { type: string }
                        name: { type: string }
                        label: { type: string, description: What an autocomplete shows }
  /search/maintenance-requests:
    get:
      tags: [Search]
      security: [{ bearerAuth: [] }]
      summary: Quick maintenance request search
      description: For autocomplete. A member finds only their own requests, as in the list.
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Request number or title
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        request_no: { type: string }
                        title: { type: string }
                        status: { type: string }
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: "No sign-in needed. 200 when the database (and Redis, if there is one) answer; 503 with `status: degraded` when one does not."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
        '503':
          description: "Degraded: the same shape, `status` is `degraded` and the failing check says why"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Health' }
  /threads:
    get:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: List chat threads (with unread counts)
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: scope
          description: "`mine` lists only the threads the caller started or wrote in (minus the ones they hid); `hidden` lists the ones they hid from that; anything else lists every thread"
          schema: { type: string, enum: [all, mine, hidden], default: all }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatThread' }
                  meta: { $ref: '#/components/schemas/ChatThreadMeta' }
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Create chat thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
              required: [title]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThreadState' }
        '422':
          description: "No title, or one that is too long"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /threads/{id}:
    get:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Show chat thread (latest messages)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThreadDetail' }
        '404':
          description: "No such thread"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /chat/my-updates:
    get:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: The threads I started or wrote in, with what is unread
      description: The 30 most recent, as a plain array (not wrapped in `data`). It is what the chat widget lists.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatUpdate' }
  /threads/{id}/lock:
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Lock a thread
      description: |
        Admin and the repair team (IT support, network, programmer, technician) only; supervisor and member get 403. A locked thread
        takes no new messages. Locking a locked thread answers 200 again.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThreadState' }
        '403': { description: The caller may not lock threads }
  /threads/{id}/unlock:
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Unlock a thread
      description: Same people as `lock`. Unlocking an open thread answers 200 again.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Unlocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThreadState' }
        '403': { description: The caller may not unlock threads }
  /threads/{id}/hide:
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Hide a thread from my "กระทู้ที่มีส่วนร่วม"
      description: >
        Per person; nothing is deleted and nobody else is affected. The thread is read up to its last message, leaves `scope=mine`,
        the widget list (`/chat/my-updates`) and the unread badge, and stays in the full list. It comes back when the caller posts in it.
        A caller who neither started nor wrote in the thread gets 422.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Hidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
        '422':
          description: The caller has no part in the thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
    delete:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Show a hidden thread in my "กระทู้ที่มีส่วนร่วม" again
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Shown again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
  /threads/{id}/messages:
    get:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: List messages in thread
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: after_id
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Post message in thread
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
              required: [body]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '422':
          description: "No words, or more than the limit (`errors`)"
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /threads/{id}/messages/{message_id}:
    patch:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Edit a message
      description: "Only the person who wrote it, and only while the thread is open - a moderator may delete somebody's message but not rewrite it. Saving the same words changes nothing (`edited` stays false). Everyone who has the thread open hears it (`message.updated`). A deleted message is 404."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: message_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 3000 }
              required: [body]
      responses:
        '200':
          description: The message as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessageEdited' }
        '403': { description: "Not the author, or the thread is locked" }
        '404': { description: "Not a message of this thread, or it was deleted" }
        '422': { description: "Empty, or longer than 3,000 characters" }
        '429': { description: "Too many messages / edits (the same limit as sending)" }
    delete:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Delete a message
      description: "Its author while the thread is open, or a moderator (admins and the IT / repair team) at any time. The row stays as a placeholder for everyone; the words are gone from every page."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: message_id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: "{ deleted: true, id }" }
        '403': { description: "Not the author (or the thread is locked) and not a moderator" }
        '404': { description: "Not a message of this thread" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Error:
      type: object
      description: What a refusal looks like when it is not a validation failure
      properties:
        message: { type: string }
        code: { type: string, description: "A stable word an app can switch on (invalid_credentials, account_suspended, ...); not on every refusal" }
        correlation_id: { type: string, description: Quote it when reporting a problem }
        toast: { $ref: '#/components/schemas/Toast' }
    ValidationError:
      type: object
      description: "A 422. Which of these keys are present depends on the route; `errors` always is."
      properties:
        message: { type: string }
        code: { type: string }
        correlation_id: { type: string }
        errors:
          type: object
          description: Field name to the messages for it
          additionalProperties:
            type: array
            items: { type: string }
        toast: { $ref: '#/components/schemas/Toast' }
    Toast:
      type: object
      description: A line for a web page to show; an app may ignore it
      properties:
        type: { type: string, enum: [success, warning, error, info] }
        message: { type: string }
        position: { type: string }
        timeout: { type: integer }
        size: { type: string }
    Message:
      type: object
      properties:
        message: { type: string }
    PersonCard:
      type: object
      description: A person as another record shows them
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, nullable: true }
        avatar_url: { type: string }
        avatar_thumb_url: { type: string }
        department_name: { type: string, nullable: true }
        role_label: { type: string }
        department_ref: { type: object, nullable: true }
    Health:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          description: One entry per check (db, redis)
          additionalProperties:
            type: object
            properties:
              status: { type: string }
              latency_ms: { type: number }
              reason: { type: string }
        meta:
          type: object
          properties:
            app: { type: string }
            env: { type: string }
            time: { type: string }
            version: { type: string }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    User:
      type: object
      description: "The short profile of `/auth/login` and `/auth/me`; `citizen_id` is the caller's own"
      properties:
        id: { type: integer }
        name: { type: string }
        citizen_id: { type: string }
        email: { type: string, format: email, nullable: true }
        role: { type: string }
        abilities:
          type: array
          items: { type: string }
    LoginUser:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            must_change_password: { type: boolean, description: "true when an admin chose the password: change it (PUT /auth/password) first, every other call answers 403 password_change_required" }
    UserRecord:
      type: object
      description: "`GET /user`: the User model without its hidden fields (no password, remember_token, citizen_id)"
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, nullable: true }
        email_verified_at: { type: string, nullable: true }
        role: { type: string }
        role_label: { type: string }
        avatar_url: { type: string }
        avatar_thumb_url: { type: string }
        department_name: { type: string, nullable: true }
        department_ref: { type: object, nullable: true }
        created_at: { type: string }
        updated_at: { type: string }
    Department:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name_th: { type: string }
        name_en: { type: string, nullable: true }
        display_name: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    AssetCategory:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        color: { type: string, nullable: true }
        description: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string }
        updated_at: { type: string }
    Asset:
      type: object
      description: "An asset as the API gives it: the columns, the computed fields (`display_name`, `status_label`, ...) and, when loaded, its category and department"
      properties:
        id: { type: integer }
        asset_code: { type: string }
        his_asset_id: { type: string, nullable: true, description: The number the hospital system (HIS) knows it by }
        name: { type: string }
        type: { type: string, nullable: true }
        brand: { type: string, nullable: true }
        model: { type: string, nullable: true }
        serial_number: { type: string, nullable: true }
        location: { type: string, nullable: true }
        internal_phone: { type: string, nullable: true }
        vendor_name: { type: string, nullable: true }
        vendor_phone: { type: string, nullable: true }
        price: { type: string, nullable: true, description: "A decimal, as text" }
        department_id: { type: integer, nullable: true }
        category_id: { type: integer, nullable: true }
        purchase_date: { type: string, nullable: true }
        warranty_start: { type: string, nullable: true }
        warranty_expire: { type: string, nullable: true }
        status: { type: string, enum: [active, in_repair, disposed] }
        created_at: { type: string }
        updated_at: { type: string }
        his_synced_at: { type: string, nullable: true }
        his_raw: { description: "What the hospital system (HIS) sent for this asset, as it sent it; null when it never synced" }
        deleted_at: { type: string, nullable: true }
        display_name: { type: string }
        status_label: { type: string }
        status_color: { type: string }
        formatted_price: { type: string, nullable: true }
        hero_image_url: { type: string, nullable: true }
        category_ref:
          oneOf:
            - $ref: '#/components/schemas/AssetCategory'
            - type: 'null'
        department:
          oneOf:
            - $ref: '#/components/schemas/Department'
            - type: 'null'
    AssetCreate:
      allOf:
        - $ref: '#/components/schemas/AssetUpdate'
      required: [asset_code,name]
    AssetUpdate:
      type: object
      properties:
        asset_code: { type: string, maxLength: 100, description: "Unique, also among deleted assets" }
        name: { type: string, maxLength: 255 }
        type: { type: string, maxLength: 100 }
        category_id: { type: integer }
        brand: { type: string, maxLength: 100 }
        model: { type: string, maxLength: 100 }
        serial_number: { type: string, maxLength: 100, description: "Unique, also among deleted assets" }
        location: { type: string, maxLength: 255 }
        department_id: { type: integer }
        his_asset_id: { type: string, maxLength: 100, description: "Unique, also among deleted assets" }
        purchase_date: { type: string, format: date }
        warranty_start: { type: string, format: date }
