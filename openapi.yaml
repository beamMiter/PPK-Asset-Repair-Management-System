openapi: 3.1.0
info:
  title: Asset Repair Management API
  version: 0.1.0
servers:
  - url: /api
tags:
  - name: Auth
    description: Authentication and token management
  - name: Assets
    description: Asset CRUD and listing
  - name: Maintenance
    description: Maintenance requests workflows
  - name: Stats
    description: Dashboard statistics
  - name: Meta
    description: Lightweight meta data for forms
  - name: Search
    description: Quick search endpoints
  - name: Chat
    description: Threaded chat endpoints
  - name: Health
    description: Healthcheck
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and receive bearer token
      description: |
        The token expires 30 days after it is issued (then sign in again). Wrong tries are counted per citizen_id + IP
        (5, then 60 s) and per IP over all accounts (30 in 5 minutes); a locked caller gets 429 with `Retry-After`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                citizen_id: { type: string, pattern: '^[0-9]{13}$', description: 13-digit citizen id }
                password: { type: string }
                device_name: { type: string, maxLength: 120 }
              required: [citizen_id, password]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  token_type: { type: string }
                  user:
                    $ref: '#/components/schemas/User'
        '401': { description: "invalid_credentials (a wrong password and an unknown citizen id read the same)" }
        '403': { description: "account_suspended (only shown when the password was right)" }
        '429':
          description: "too_many_attempts (see Retry-After) or RATE_LIMITED"
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds to wait }
  /auth/me:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Current authenticated user profile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
  /auth/tokens:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: List active personal access tokens
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        abilities:
                          type: array
                          items: { type: string }
                        last_used_at: { type: string, nullable: true }
                        created_at: { type: string }
  /auth/tokens/{id}:
    delete:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Revoke a token by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Revoked }
  /auth/password:
    put:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Change my own password
      description: >
        Also the way out for an account whose password an admin chose: every other call answers 403 `password_change_required` until this
        succeeds. The token used for this call stays valid; every other token of the account ends. 6 calls a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, password, password_confirmation]
              properties:
                current_password: { type: string }
                password: { type: string, description: "8+ characters with a letter and a digit, different from the current one" }
                password_confirmation: { type: string }
      responses:
        '200':
          description: Changed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  must_change_password: { type: boolean }
        '422': { description: "The current password is wrong, or the new one is weak, unconfirmed or the same" }
  /auth/logout:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Logout (revoke current token)
      description: With a bearer token that token is revoked; called with the browser's own session the session ends.
      responses:
        '200': { description: Logged out }
  /auth/logout-all:
    post:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: Logout and revoke all tokens
      responses:
        '200': { description: Logged out all }
  /auth/password/email:
    post:
      tags: [Auth]
      summary: Request password reset email
      description: |
        Answers 200 with the same message whether or not the address has an account (a different answer would list the
        addresses that do); the mail, if any, is sent after the response. 5 requests per minute per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        '200': { description: "Accepted — \"if this address has an account, a link is on its way\"" }
        '422': { description: Not a well-formed address }
  /auth/password/reset:
    post:
      tags: [Auth]
      summary: Reset password with token
      description: |
        Success ends every other way into the account: all API tokens, "remember me" cookies and browser sessions.
        A wrong token, an expired one and an unknown address are refused in the same words.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                token: { type: string }
                password: { type: string, minLength: 8, description: At least 8 characters with a letter and a digit }
                password_confirmation: { type: string }
              required: [email,token,password,password_confirmation]
      responses:
        '200': { description: Reset OK }
        '400': { description: "password_reset_failed" }
        '422': { description: Password does not meet the rule }
  /assets:
    get:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: List assets (paginated)
      parameters:
        - in: query
          name: per_page
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Asset' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Create asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
      responses:
        '201': { description: Created }
  /assets/{id}:
    get:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Show asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetWrapper' }
    put:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Update asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetUpdate' }
      responses:
        '200': { description: Updated }
    patch:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Update asset (same route and rules as PUT)
      description: "`PUT` and `PATCH` are one route: send the fields to change."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetWrapper' }
        '403': { description: "Not an admin, supervisor or repair-team member" }
        '422': { description: Invalid input }
    delete:
      tags: [Assets]
      security: [{ bearerAuth: [] }]
      summary: Delete asset
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: Deleted }
  /repair-requests:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: List maintenance requests
      parameters:
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: priority
          schema: { type: string }
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MaintenanceRequest' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Create maintenance request
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                title: { type: string }
                priority: { type: string }
                description: { type: string }
                asset_id: { type: integer, nullable: true }
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required: [title,priority]
      responses:
        '201': { description: Created }
  /repair-requests/{id}:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Show maintenance request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MaintenanceRequestWrapper' }
    put:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Update maintenance request
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/MaintenanceRequestUpdate'
      responses:
        '200': { description: Updated }
  /repair-requests/{id}/transition:
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Transition maintenance request status
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string }
                note: { type: string }
                technician_id: { type: integer }
              required: [status]
      responses:
        '200': { description: Transitioned }
  /repair-requests/{id}/logs:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: List maintenance request logs
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MaintenanceLog' }
  /user:
    get:
      tags: [Auth]
      security: [{ bearerAuth: [] }]
      summary: The signed-in user's record
      description: |
        The whole User model minus its hidden fields (no password, remember_token or citizen_id). `/auth/me` is the short profile
        (it includes the caller's own citizen_id) plus the token's abilities.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /repair-requests/my-jobs:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: My jobs (requests I lead or am assigned to)
      description: |
        Requests where the caller leads the team or is assigned (not one removed from the job). Staff only: admin, supervisor and the
        repair team; a member gets 403. Declared above `/repair-requests/{id}`, which would otherwise take "my-jobs" for an id.
      parameters:
        - in: query
          name: search
          schema: { type: string }
          description: Request number or title
        - in: query
          name: status
          schema: { type: string }
          description: A status. Omitted = every status; `all` = every status except closed.
        - in: query
          name: page
          schema: { type: integer }
      responses:
        '200':
          description: OK (a Laravel paginator, 20 a page, under `data`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      current_page: { type: integer }
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MaintenanceRequest' }
                      last_page: { type: integer }
                      per_page: { type: integer }
                      total: { type: integer }
        '403': { description: The caller is a member }
  /repair-requests/pending/evaluations:
    get:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: My requests waiting for a rating
      description: |
        Requests I reported that I have approved (status `closed`), have not rated yet, and that are still inside the 30 days
        after the approval. A request that is only `resolved` is not listed: the rating comes after the approval.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/MaintenanceRequest' }
  /repair-requests/{id}/cancel:
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Cancel (withdraw) a request
      description: |
        The reporter cancels their own request at any time before it is finished: pending, acknowledged, returned, accepted, in progress
        or on hold. Admin and supervisor may do it for any unfinished request, and staff assigned to the request in the statuses the policy
        allows (`MaintenanceRequestPolicy::cancelByTech`). Any other member, and a request that is already resolved, closed, cancelled or
        rejected, gets 403. This is the only way for a reporter to change a status: `PUT /repair-requests/{id}`
        with a `status` is refused with 422 for them.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                cancel_reason: { type: string, maxLength: 2000, description: "Kept in the history; \"ยกเลิกโดยผู้ใช้งาน\" when empty" }
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '403':
          description: Not allowed (not the reporter or an administrator, or the request is finished)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '422': { description: "cancel_reason is longer than 2,000 characters" }
  /repair-requests/{id}/resubmit:
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Send a request again after fixing it
      description: |
        For a request the staff sent back (`returned`, via `POST …/transition` with `status=returned` and a `note` saying what to fix): the
        reporter, or an admin or supervisor for them, sends it again and it becomes `pending` with the same number and history. A request
        that is not `returned`, or a caller who is not allowed, gets 403. A request left `returned` for 14 days (`REPAIR_RETURN_EXPIRES_AFTER_DAYS`)
        is cancelled by the nightly sweep.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Sent again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
        '403':
          description: Not the reporter, or the request is not `returned`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionResult' }
  /repair-requests/{id}/rating:
    post:
      tags: [Maintenance]
      security: [{ bearerAuth: [] }]
      summary: Rate a finished request
      description: |
        One score for the whole job, counted for every person on its team. Only the reporter may rate, only after they have approved the
        request (`closed`), once, and within 30 days of the approval. Rating closes nothing: approving is a separate step.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000, description: "Required when the score is 1 or 2" }
              required: [score]
      responses:
        '201':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      maintenance_request_id: { type: integer }
                      rater_id: { type: integer }
                      technician_id: { type: integer, description: The lead the score is tied to }
                      score: { type: integer }
                      comment: { type: string, nullable: true }
        '403': { description: The caller did not report this request }
        '409': { description: The request has been rated already }
        '422': { description: "Not closed yet, past the 30 days, no lead to tie the score to, or invalid input (1-2 stars need a comment)" }
  /attachments:
    post:
      tags: [Maintenance]
      deprecated: true
      security: [{ bearerAuth: [] }]
      summary: Removed (always 410)
      description: |
        Kept so an old client gets a clear answer instead of 404. Attach files when reporting (`POST /repair-requests`, `files[]`);
        add or remove files of an existing request with the web routes `POST|DELETE /maintenance/requests/{req}/attachments`.
        A file is opened with `GET /attachments/{id}` (outside `/api`; the `url` of the attachment, bearer token accepted).
      responses:
        '410': { description: "Gone: {error: deprecated, message}" }
  /attachments/{id}:
    delete:
      tags: [Maintenance]
      deprecated: true
      security: [{ bearerAuth: [] }]
      summary: Removed (410 for an attachment that exists)
      description: See `POST /attachments`.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '410': { description: "Gone: {error: deprecated, message}" }
        '404': { description: No attachment has this id }
  /stats/summary:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Dashboard summary statistics
      responses:
        '200':
          description: Stats summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets_total: { type: integer }
                  requests_open: { type: integer }
                  requests_closed: { type: integer }
                  priority_counts:
                    type: object
                    properties:
                      low: { type: integer }
                      medium: { type: integer }
                      high: { type: integer }
                      urgent: { type: integer }
                  recent_daily:
                    type: array
                    items:
                      type: object
                      properties:
                        date: { type: string, format: date }
                        count: { type: integer }
  /stats/maintenance/status-counts:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Maintenance status counts
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    additionalProperties: { type: integer }
  /stats/maintenance/technicians:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Technician performance summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/TechnicianSummary' }
  /stats/assets/by-department:
    get:
      tags: [Stats]
      security: [{ bearerAuth: [] }]
      summary: Asset counts by department
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/DepartmentAssetCount' }
  /meta/departments:
    get:
      tags: [Meta]
      security: [{ bearerAuth: [] }]
      summary: List departments meta
      responses:
        '200': { description: OK }
  /meta/categories:
    get:
      tags: [Meta]
      security: [{ bearerAuth: [] }]
      summary: List asset categories meta
      responses:
        '200': { description: OK }
  /meta/users:
    get:
      tags: [Meta]
      security: [{ bearerAuth: [] }]
      summary: List users (filter by role)
      parameters:
        - in: query
          name: role
          schema: { type: string }
      responses:
        '200': { description: OK }
  /search/assets:
    get:
      tags: [Search]
      security: [{ bearerAuth: [] }]
      summary: Quick asset search
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200': { description: OK }
  /search/maintenance-requests:
    get:
      tags: [Search]
      security: [{ bearerAuth: [] }]
      summary: Quick maintenance request search
      parameters:
        - in: query
          name: q
          schema: { type: string }
      responses:
        '200': { description: OK }
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200': { description: OK }
  /threads:
    get:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: List chat threads (with unread counts)
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: scope
          description: "`mine` lists only the threads the caller started or wrote in (minus the ones they hid); `hidden` lists the ones they hid from that; anything else lists every thread"
          schema: { type: string, enum: [all, mine, hidden], default: all }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatThread' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Create chat thread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
              required: [title]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThread' }
  /threads/{id}:
    get:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Show chat thread (latest messages)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThreadDetail' }
  /chat/my-updates:
    get:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: The threads I started or wrote in, with what is unread
      description: The 30 most recent, as a plain array (not wrapped in `data`). It is what the chat widget lists.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChatUpdate' }
  /threads/{id}/lock:
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Lock a thread
      description: |
        Admin and the repair team (IT support, network, programmer, technician) only; supervisor and member get 403. A locked thread
        takes no new messages. Locking a locked thread answers 200 again.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Locked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThreadState' }
        '403': { description: The caller may not lock threads }
  /threads/{id}/unlock:
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Unlock a thread
      description: Same people as `lock`. Unlocking an open thread answers 200 again.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Unlocked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatThreadState' }
        '403': { description: The caller may not unlock threads }
  /threads/{id}/hide:
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Hide a thread from my "กระทู้ที่มีส่วนร่วม"
      description: >
        Per person; nothing is deleted and nobody else is affected. The thread is read up to its last message, leaves `scope=mine`,
        the widget list (`/chat/my-updates`) and the unread badge, and stays in the full list. It comes back when the caller posts in it.
        A caller who neither started nor wrote in the thread gets 422.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Hidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
        '422':
          description: The caller has no part in the thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
    delete:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Show a hidden thread in my "กระทู้ที่มีส่วนร่วม" again
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Shown again
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HiddenState' }
  /threads/{id}/messages:
    get:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: List messages in thread
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: after_id
          schema: { type: integer }
        - in: query
          name: limit
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ChatMessage' }
    post:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Post message in thread
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string }
              required: [body]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
  /threads/{id}/messages/{message_id}:
    patch:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Edit a message
      description: "Only the person who wrote it, and only while the thread is open - a moderator may delete somebody's message but not rewrite it. Saving the same words changes nothing (`edited` stays false). Everyone who has the thread open hears it (`message.updated`). A deleted message is 404."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: message_id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                body: { type: string, maxLength: 3000 }
              required: [body]
      responses:
        '200':
          description: The message as it is now
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatMessage' }
        '403': { description: "Not the author, or the thread is locked" }
        '404': { description: "Not a message of this thread, or it was deleted" }
        '422': { description: "Empty, or longer than 3,000 characters" }
        '429': { description: "Too many messages / edits (the same limit as sending)" }
    delete:
      tags: [Chat]
      security: [{ bearerAuth: [] }]
      summary: Delete a message
      description: "Its author while the thread is open, or a moderator (admins and the IT / repair team) at any time. The row stays as a placeholder for everyone; the words are gone from every page."
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: path
          name: message_id
          required: true
          schema: { type: integer }
      responses:
        '200': { description: "{ deleted: true, id }" }
        '403': { description: "Not the author (or the thread is locked) and not a moderator" }
        '404': { description: "Not a message of this thread" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        last_page: { type: integer }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        abilities:
          type: array
          items: { type: string }
    Asset:
      type: object
      properties:
        id: { type: integer }
        asset_code: { type: string }
        name: { type: string }
        type: { type: string }
        brand: { type: string }
        model: { type: string }
        serial_number: { type: string }
        location: { type: string }
        status: { type: string }
        department_id: { type: integer }
        category_id: { type: integer }
    AssetCreate:
      allOf:
        - $ref: '#/components/schemas/AssetUpdate'
      required: [asset_code,name]
    AssetUpdate:
      type: object
      properties:
        asset_code: { type: string }
        name: { type: string }
        type: { type: string }
        category_id: { type: integer }
        brand: { type: string }
        model: { type: string }
        serial_number: { type: string }
        location: { type: string }
        department_id: { type: integer }
        purchase_date: { type: string, format: date }
        warranty_expire: { type: string, format: date }
        status: { type: string }
    AssetWrapper:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Asset' }
    Token:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        abilities:
          type: array
          items: { type: string }
        last_used_at: { type: string, nullable: true }
        created_at: { type: string }
    UserBasic:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    ChatMessage:
      type: object
      properties:
        id: { type: integer }
        user:
          $ref: '#/components/schemas/UserBasic'
        body: { type: string }
        edited: { type: boolean, description: "Its author changed the words after sending" }
        edited_at: { type: string, nullable: true }
        created_at: { type: string }
    ChatThread:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        is_locked: { type: boolean }
        hidden_by_me: { type: boolean, description: "Hidden from the caller's กระทู้ที่มีส่วนร่วม (list only)" }
        created_at: { type: string }
        author:
          $ref: '#/components/schemas/UserBasic'
        messages_count: { type: integer }
        unread_count: { type: integer }
        latest_message:
          $ref: '#/components/schemas/ChatMessage'
    HiddenState:
      type: object
      properties:
        hidden: { type: boolean }
        message: { type: string }
    ChatThreadDetail:
      allOf:
        - $ref: '#/components/schemas/ChatThread'
        - type: object
          properties:
            locked_at: { type: string, nullable: true, description: "When the thread was locked (null when open)" }
            auto_lock_on:
              type: string
              format: date
              nullable: true
              description: "Thai calendar day the nightly sweep locks this open thread if nobody writes - only in the last CHAT_WARN_DAYS_BEFORE (14) days before it, else null. A thread nobody has written in for CHAT_LOCK_IDLE_AFTER_DAYS (90) is locked."
            auto_delete_on:
              type: string
              format: date
              nullable: true
              description: "Thai calendar day the sweep deletes this LOCKED thread if nobody unlocks it (locked for CHAT_DELETE_LOCKED_AFTER_DAYS, 90). Null when open or the rule is off. Unlocking (POST .../unlock) restarts both counts."
            latest_messages:
              type: array
              items: { $ref: '#/components/schemas/ChatMessage' }
    MaintenanceRequest:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        priority: { type: string }
        asset_id: { type: integer, nullable: true }
        reporter_id: { type: integer, nullable: true }
        reporter_email: { type: string, nullable: true }
        request_date: { type: string, format: date-time }
    MaintenanceRequestUpdate:
      type: object
      properties:
        title: { type: string }
        description: { type: string }
        priority: { type: string }
        status: { type: string }
        asset_id: { type: integer }
        reporter_email: { type: string }
        files:
          type: array
          items:
            type: string
            format: binary
    MaintenanceRequestWrapper:
      type: object
      properties:
        data: { $ref: '#/components/schemas/MaintenanceRequest' }
    MaintenanceLog:
      type: object
      properties:
        id: { type: integer }
        action: { type: string }
        note: { type: string, nullable: true }
        user_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
    TechnicianSummary:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        total: { type: integer }
        open: { type: integer }
        closed: { type: integer }
        avg_hours: { type: number, nullable: true }
    DepartmentAssetCount:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, nullable: true }
        count: { type: integer }
    ActionResult:
      type: object
      description: The answer of a status action (cancel, resubmit, ...), and of a refusal of one
      properties:
        message: { type: string }
        toast:
          type: object
          properties:
            type: { type: string, enum: [success, warning, error, info] }
            message: { type: string }
    ChatThreadState:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        is_locked: { type: boolean }
        created_at: { type: string }
    ChatUpdate:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        show_url: { type: string }
        unread: { type: integer }
        last_user_name: { type: string, nullable: true }
        last_body: { type: string, nullable: true }
        last_created_at: { type: string, nullable: true }
