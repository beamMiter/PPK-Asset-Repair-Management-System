user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  server_tokens off;

  # What is served from /storage/ is what people UPLOADED. A browser must never run it as a page: an SVG or HTML file opened directly would
  # execute its script on this site's own address, as whoever opened it. `sandbox` with no allow-scripts stops that; a PDF is left out
  # because Chrome's PDF viewer will not open inside a sandbox. (Pictures shown in a page with <img> were never a danger.)
  map $uri $storage_csp {
    ~*\.pdf$  "";
    default   "default-src 'none'; style-src 'unsafe-inline'; sandbox";
  }

  server {
    listen 80;
    server_name  localhost;
    root   /var/www/html/public;
    index  index.php index.html;

    # A whole upload form: up to 3 files of 10 MB (config/uploads.php) and the rest of the form. Equal to post_max_size in .docker/php.ini,
    # so nginx does not turn away (413) what PHP would take, nor PHP take what nginx would not.
    client_max_body_size 40m;

    # Nothing that starts with a dot is for the outside (.htaccess, .user.ini, .env, .git ...), except /.well-known/.
    location ~ /\.(?!well-known/) {
      return 404;
    }

    # Vite builds these with a hash in the file name, so a file never changes under its name: keep it for a year, and compress it.
    # (Only the built files are compressed - the pages carry a CSRF token, and compressing those is a needless risk (BREACH).)
    location /build/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
      gzip on;
      gzip_comp_level 5;
      gzip_min_length 1024;
      gzip_vary on;
      gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
      access_log off;
    }

    # Uploads (avatars, attachments) are served straight from the storage folder rather than through public/storage: that
    # link is made on the host with an absolute path, which does not exist in here. `^~` also keeps a .php file that
    # someone uploaded from reaching the php location below.
    location ^~ /storage/ {
      alias /var/www/html/storage/app/public/;
      access_log off;
      add_header X-Content-Type-Options "nosniff" always;
      add_header Content-Security-Policy $storage_csp always;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass app:9000;
      fastcgi_index index.php;
    }
  }
}
