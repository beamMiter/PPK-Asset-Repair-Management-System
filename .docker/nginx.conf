user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile        on;
  keepalive_timeout  65;
  server {
    listen 80;
    server_name  localhost;
    root   /var/www/html/public;
    index  index.php index.html;

    location /build/ {
      try_files $uri $uri/ =404;
    }

    # Uploads (avatars, attachments) are served straight from the storage folder rather than through public/storage: that
    # link is made on the host with an absolute path, which does not exist in here. `^~` also keeps a .php file that
    # someone uploaded from reaching the php location below.
    location ^~ /storage/ {
      alias /var/www/html/storage/app/public/;
      access_log off;
    }

    location / {
      try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
      include fastcgi_params;
      fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
      fastcgi_pass app:9000;
      fastcgi_index index.php;
    }

    client_max_body_size 20m;
  }
}
