; PHP settings of the container (php-fpm for `app`, the CLI for `worker` and `scheduler`). Copied to conf.d by .docker/Dockerfile.
; The image ships NO php.ini, so before this file PHP ran on its built-in defaults: uploads capped at 2 MB (the app promises 10 MB a file),
; and public/.user.ini set memory_limit = -1 (no ceiling for any request).

; --- uploads: config/uploads.php allows 10 MB a file and 3 files a form; nginx's client_max_body_size is the same 40M as post_max_size ---
upload_max_filesize = 12M
post_max_size = 40M
max_file_uploads = 10

; --- limits: a PDF report needs far less than this; a runaway request must not be able to take the whole machine ---
memory_limit = 512M
max_execution_time = 60

; --- production hygiene ---
expose_php = Off
display_errors = Off
log_errors = On

; --- opcache: the compiled PHP is kept between requests. Files are re-checked every 2 seconds while PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 (the
; default, for the bind-mounted dev setup); a production image sets it to 0 and never re-reads a file (restart / redeploy to pick up code) ---
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS:-1}
opcache.revalidate_freq = 2
